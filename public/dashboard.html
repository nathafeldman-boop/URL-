<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Verdict — Dashboard</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/dashboard.css" />
</head>
<body>

  <header class="nav">
    <a class="nav-brand" href="/">
      <span class="nav-logo" aria-hidden="true">
        <img src="/assets/logo-mark.png" alt="" width="24" height="19" />
      </span>
      Verdict <span class="pro-badge" style="background:var(--text)">Dashboard</span>
    </a>
  </header>

  <main class="dash-main">

    <!-- ==================================================== Connexion -->
    <section class="card dash-login" id="dash-login">
      <h1 class="dash-title">Connexion</h1>
      <p class="card-sub">Accès réservé — connecte-toi avec un compte autorisé.</p>

      <button class="btn-google" id="dg-google-btn" type="button">
        <svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true">
          <path fill="#4285F4" d="M19.6 10.23c0-.68-.06-1.36-.18-2H10v3.79h5.4a4.63 4.63 0 01-2 3.04v2.5h3.23c1.9-1.74 2.97-4.32 2.97-7.33z"/>
          <path fill="#34A853" d="M10 20c2.7 0 4.96-.89 6.62-2.42l-3.23-2.5c-.9.6-2.05.95-3.39.95-2.6 0-4.8-1.76-5.6-4.12H1.06v2.59A10 10 0 0010 20z"/>
          <path fill="#FBBC05" d="M4.4 11.9a6 6 0 010-3.8V5.5H1.06a10 10 0 000 8.99l3.34-2.6z"/>
          <path fill="#EA4335" d="M10 3.98c1.47 0 2.79.5 3.82 1.5l2.86-2.86C14.95.99 12.7 0 10 0 6.09 0 2.7 2.24 1.06 5.5l3.34 2.59C5.2 5.73 7.4 3.98 10 3.98z"/>
        </svg>
        Continuer avec Google
      </button>
      <div class="account-divider"><span>ou par email</span></div>

      <form class="account-signin" id="dg-signin-form" autocomplete="off">
        <div class="account-row">
          <input id="dg-signin-email" type="email" placeholder="ton@email.com" aria-label="Ton email" required />
          <button class="btn btn-primary btn-sm" id="dg-signin-btn" type="submit">Recevoir un code</button>
        </div>
        <p class="account-msg" id="dg-signin-msg" hidden></p>
      </form>
      <form class="account-signin" id="dg-code-form" autocomplete="off" hidden>
        <p class="account-hint">Code envoyé à <b id="dg-code-email-display"></b></p>
        <div class="account-row">
          <input id="dg-signin-code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="123456" aria-label="Code reçu par email" required />
          <button class="btn btn-primary btn-sm" id="dg-code-btn" type="submit">Valider</button>
        </div>
        <p class="account-msg" id="dg-code-msg" hidden></p>
      </form>
    </section>

    <!-- ==================================================== Refus -->
    <section class="card dash-denied" id="dash-denied" hidden>
      <h1 class="dash-title">Accès refusé</h1>
      <p class="card-sub">Ce compte n'est pas autorisé à voir ce dashboard.</p>
      <button class="btn btn-ghost btn-sm" id="dg-signout-btn" type="button">Se déconnecter</button>
    </section>

    <!-- ==================================================== Contenu -->
    <section class="dash-content" id="dash-content" hidden>

      <div class="dash-kpis" id="dash-kpis"></div>

      <div class="card dash-chart-card">
        <div class="dash-chart-head">
          <div class="dash-tabs" id="dash-metric-tabs">
            <button class="dash-tab is-active" data-metric="analyze">Analyses</button>
            <button class="dash-tab" data-metric="compare">Comparaisons</button>
            <button class="dash-tab" data-metric="signup">Inscriptions</button>
            <button class="dash-tab" data-metric="pro_activated">Activations Pro</button>
          </div>
          <div class="dash-tabs dash-tabs-range" id="dash-range-tabs">
            <button class="dash-tab is-active" data-range="hour">Heure</button>
            <button class="dash-tab" data-range="day">Jour</button>
            <button class="dash-tab" data-range="week">Semaine</button>
            <button class="dash-tab" data-range="month">Mois</button>
          </div>
        </div>
        <p class="dash-chart-total" id="dash-chart-total"></p>
        <div class="dash-chart" id="dash-chart"></div>
      </div>

      <p class="dash-updated" id="dash-updated"></p>
    </section>

  </main>

  <script src="/auth.js"></script>
  <script src="/dashboard.js"></script>
</body>
</html>
